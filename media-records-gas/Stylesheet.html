<style>
  :root {
    --green-900: #0b3d1f;
    --green-700: #14562e;
    --green-600: #1a7a3c;
    --green-500: #1f9e4d;
    --green-100: #e5f5ea;
    --green-50: #f3faf5;
    --text: #1a2b20;
    --muted: #5a6d60;
    --border: #cfe6d6;
    --danger: #c0392b;
    --white: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', Sarabun, Tahoma, Arial, sans-serif;
    background: var(--green-50);
    color: var(--text);
  }

  .app {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }

  .app-header h1 {
    text-align: center;
    color: var(--green-900);
    font-size: 22px;
    margin: 8px 0 20px;
  }

  .tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    background: var(--green-100);
    padding: 6px;
    border-radius: 12px;
  }

  .tab-btn {
    flex: 1;
    padding: 10px 12px;
    border: none;
    border-radius: 8px;
    background: transparent;
    color: var(--green-700);
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab-btn.active {
    background: var(--green-600);
    color: var(--white);
  }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; }

  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 2px 10px rgba(20, 86, 46, 0.06);
  }

  .field {
    margin-bottom: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  label {
    font-size: 14px;
    font-weight: 600;
    color: var(--green-900);
  }

  .req { color: var(--danger); }

  input[type="text"], select {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: var(--white);
    color: var(--text);
  }

  input[type="text"]:focus, select:focus {
    outline: none;
    border-color: var(--green-500);
    box-shadow: 0 0 0 3px rgba(31, 158, 77, 0.15);
  }

  .actions {
    display: flex;
    gap: 10px;
    margin-top: 8px;
  }

  .btn-primary, .btn-secondary {
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }

  .btn-primary {
    background: var(--green-600);
    color: var(--white);
    flex: 1;
  }

  .btn-primary:hover { background: var(--green-700); }
  .btn-primary:disabled { background: #9bc7a8; cursor: not-allowed; }

  .btn-secondary {
    background: var(--white);
    color: var(--green-700);
    border: 1px solid var(--green-500);
  }

  .btn-secondary:hover { background: var(--green-100); }

  .message {
    margin-top: 14px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
  }

  .message.error {
    background: #fdecea;
    color: var(--danger);
    border: 1px solid #f3c2bd;
  }

  .message.info {
    background: var(--green-100);
    color: var(--green-800, var(--green-700));
    border: 1px solid var(--border);
  }

  .result-box {
    margin-top: 16px;
    padding: 16px;
    background: var(--green-100);
    border: 1px solid var(--green-500);
    border-radius: 10px;
    text-align: center;
  }

  .result-box p {
    margin: 0 0 6px;
    font-size: 14px;
    color: var(--green-900);
  }

  .media-id {
    font-size: 20px;
    font-weight: 700;
    color: var(--green-700);
    letter-spacing: 0.5px;
  }

  .search-row {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
  }

  .search-row input {
    flex: 1;
  }

  .table-wrap {
    overflow-x: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  th, td {
    text-align: left;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
  }

  th {
    background: var(--green-100);
    color: var(--green-900);
    font-weight: 700;
  }

  tbody tr:hover { background: var(--green-50); }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 20px 0 4px;
  }
</style>
