<script>
  (function () {
    var typeLabelByCode = {};
    var currentUser = null; // { username, type }

    // Which tabs each user type is allowed to see.
    var TAB_ACCESS = {
      All: ['entry', 'search'],
      Media: ['entry'],
      Operation: ['search']
    };

    function showMessage(elId, text, type) {
      var el = document.getElementById(elId);
      el.textContent = text;
      el.className = 'message ' + type;
      el.hidden = false;
    }

    function hideMessage(elId) {
      document.getElementById(elId).hidden = true;
    }

    // ---- Login ----
    var loginScreen = document.getElementById('login-screen');
    var appScreen = document.getElementById('app-screen');
    var loginForm = document.getElementById('login-form');
    var loginBtn = document.getElementById('login-btn');
    var userBar = document.getElementById('user-bar');
    var userInfo = document.getElementById('user-info');

    loginForm.addEventListener('submit', function (e) {
      e.preventDefault();
      hideMessage('login-message');
      loginBtn.disabled = true;
      loginBtn.textContent = 'กำลังเข้าสู่ระบบ...';

      var username = document.getElementById('login-username').value;
      var password = document.getElementById('login-password').value;

      google.script.run
        .withSuccessHandler(function (user) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'เข้าสู่ระบบ';
          onLoginSuccess(user);
        })
        .withFailureHandler(function (err) {
          loginBtn.disabled = false;
          loginBtn.textContent = 'เข้าสู่ระบบ';
          showMessage('login-message', err.message, 'error');
        })
        .loginUser(username, password);
    });

    function onLoginSuccess(user) {
      currentUser = user;
      loginScreen.hidden = true;
      appScreen.hidden = false;
      userBar.hidden = false;
      userInfo.textContent = user.username + ' (' + user.type + ')';
      setupTabsForUser(user.type);
      loadMediaTypes();
    }

    document.getElementById('logout-btn').addEventListener('click', function () {
      currentUser = null;
      userInfo.textContent = '';
      loginForm.reset();
      hideMessage('login-message');
      appScreen.hidden = true;
      userBar.hidden = true;
      loginScreen.hidden = false;

      // Clear entry form state so it doesn't carry over to the next login.
      entryForm.reset();
      hideMessage('entry-message');
      resultBox.hidden = true;

      // Clear search state so results don't carry over to the next login.
      searchInput.value = '';
      tbody.innerHTML = '';
      table.hidden = true;
      noResults.hidden = true;
      hideMessage('search-message');
    });

    // ---- Tabs (gated by user type) ----
    var tabButtons = document.querySelectorAll('.tab-btn');

    function setupTabsForUser(type) {
      var allowed = TAB_ACCESS[type] || [];
      var firstVisible = null;

      tabButtons.forEach(function (btn) {
        var isAllowed = allowed.indexOf(btn.dataset.tab) !== -1;
        btn.hidden = !isAllowed;
        if (isAllowed && !firstVisible) firstVisible = btn.dataset.tab;
      });

      tabButtons.forEach(function (b) {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.tab-panel').forEach(function (p) {
        p.classList.remove('active');
      });

      if (firstVisible) {
        var activeBtn = document.querySelector('.tab-btn[data-tab="' + firstVisible + '"]');
        activeBtn.classList.add('active');
        activeBtn.setAttribute('aria-selected', 'true');
        document.getElementById('tab-' + firstVisible).classList.add('active');
      }
    }

    tabButtons.forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.hidden) return;
        tabButtons.forEach(function (b) {
          b.classList.remove('active');
          b.setAttribute('aria-selected', 'false');
        });
        document.querySelectorAll('.tab-panel').forEach(function (p) {
          p.classList.remove('active');
        });
        btn.classList.add('active');
        btn.setAttribute('aria-selected', 'true');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    // ---- Load media type options ----
    function loadMediaTypes() {
      google.script.run
        .withSuccessHandler(function (types) {
          var select = document.getElementById('typeOfMedia');
          select.innerHTML = '<option value="" disabled selected>-- เลือกประเภท --</option>';
          types.forEach(function (t) {
            typeLabelByCode[t.code] = t.label;
            var opt = document.createElement('option');
            opt.value = t.code;
            opt.textContent = t.label;
            select.appendChild(opt);
          });
        })
        .withFailureHandler(function (err) {
          showMessage('entry-message', 'โหลดประเภทสื่อไม่สำเร็จ: ' + err.message, 'error');
        })
        .getMediaTypes();
    }

    // ---- Entry form ----
    var entryForm = document.getElementById('entry-form');
    var submitBtn = document.getElementById('submit-btn');
    var resultBox = document.getElementById('result-box');
    var resultMediaId = document.getElementById('result-media-id');

    entryForm.addEventListener('submit', function (e) {
      e.preventDefault();
      hideMessage('entry-message');
      resultBox.hidden = true;

      var formData = {
        username: currentUser ? currentUser.username : '',
        mediaName: document.getElementById('mediaName').value,
        agencyHouse: document.getElementById('agencyHouse').value,
        version: document.getElementById('version').value,
        typeOfMedia: document.getElementById('typeOfMedia').value
      };

      submitBtn.disabled = true;
      submitBtn.textContent = 'กำลังบันทึก...';

      google.script.run
        .withSuccessHandler(function (record) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'บันทึกข้อมูล';
          resultMediaId.textContent = record.mediaId;
          resultBox.hidden = false;
          entryForm.reset();
        })
        .withFailureHandler(function (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'บันทึกข้อมูล';
          showMessage('entry-message', err.message, 'error');
        })
        .saveMediaRecord(formData);
    });

    document.getElementById('reset-btn').addEventListener('click', function () {
      entryForm.reset();
      hideMessage('entry-message');
      resultBox.hidden = true;
    });

    // ---- Search ----
    var searchInput = document.getElementById('search-input');
    var searchBtn = document.getElementById('search-btn');
    var tbody = document.getElementById('results-tbody');
    var noResults = document.getElementById('no-results');
    var table = document.getElementById('results-table');

    function runSearch() {
      if (!currentUser) return;
      hideMessage('search-message');
      searchBtn.disabled = true;
      searchBtn.textContent = 'กำลังค้นหา...';

      google.script.run
        .withSuccessHandler(function (results) {
          searchBtn.disabled = false;
          searchBtn.textContent = 'ค้นหา';
          renderResults(results);
        })
        .withFailureHandler(function (err) {
          searchBtn.disabled = false;
          searchBtn.textContent = 'ค้นหา';
          showMessage('search-message', err.message, 'error');
        })
        .searchMediaRecords({ username: currentUser.username, keyword: searchInput.value });
    }

    function renderResults(results) {
      tbody.innerHTML = '';
      if (!results || results.length === 0) {
        table.hidden = true;
        noResults.hidden = false;
        return;
      }
      table.hidden = false;
      noResults.hidden = true;
      results.forEach(function (r) {
        var tr = document.createElement('tr');
        [r.mediaId, r.mediaName, r.agencyHouse, r.version, typeLabelByCode[r.typeOfMedia] || r.typeOfMedia]
          .forEach(function (value) {
            var td = document.createElement('td');
            td.textContent = value;
            tr.appendChild(td);
          });
        tbody.appendChild(tr);
      });
    }

    searchBtn.addEventListener('click', runSearch);
    searchInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') runSearch();
    });
  })();
</script>
