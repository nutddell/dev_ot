<script>
  (function () {
    var COLOR_SLOTS = 4;
    // Initial value of an unused slot's picker. Deliberately an odd shade so
    // picking plain black/white still fires a `change` event.
    var EMPTY_PICKER_VALUE = '#808081';
    var REFRESH_MS = 60000;

    var state = { printers: [], queue: [], done: [] };
    var busy = 0;

    // ---- Helpers ----

    function $(id) { return document.getElementById(id); }

    function el(tag, props, children) {
      var node = document.createElement(tag);
      Object.keys(props || {}).forEach(function (key) {
        if (key === 'className') node.className = props[key];
        else if (key === 'text') node.textContent = props[key];
        else if (key === 'style') node.setAttribute('style', props[key]);
        else if (key.indexOf('on') === 0) node.addEventListener(key.slice(2), props[key]);
        else node.setAttribute(key, props[key]);
      });
      (children || []).forEach(function (child) {
        if (child) node.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
      });
      return node;
    }

    var messageTimer = null;
    function showMessage(text, type) {
      var box = $('message');
      box.textContent = text;
      box.className = 'message ' + type;
      box.hidden = false;
      clearTimeout(messageTimer);
      messageTimer = setTimeout(function () { box.hidden = true; }, type === 'error' ? 8000 : 3000);
    }

    /**
     * Calls a server function; every mutating server function returns the
     * fresh getData() payload, so the page simply re-renders from it.
     */
    function call(fnName, args, onDone) {
      busy++;
      var runner = google.script.run
        .withSuccessHandler(function (data) {
          busy--;
          render(data);
          if (onDone) onDone(true);
        })
        .withFailureHandler(function (err) {
          busy--;
          showMessage(err.message || String(err), 'error');
          if (onDone) onDone(false);
        });
      runner[fnName].apply(runner, args || []);
    }

    function printerById(id) {
      for (var i = 0; i < state.printers.length; i++) {
        if (state.printers[i].id === id) return state.printers[i];
      }
      return null;
    }

    function printerChip(printerId, fallbackName) {
      var printer = printerById(printerId);
      var dots = el('span', { className: 'dots' }, (printer ? printer.colors : [])
        .filter(Boolean)
        .map(function (c) { return el('span', { className: 'dot', style: 'background:' + c, title: c }); }));
      return el('span', { className: 'printer-chip' }, [printer ? printer.name : fallbackName, dots]);
    }

    // ---- Rendering ----

    function render(data) {
      state = data;
      $('loading').hidden = true;
      $('queue-count').textContent = data.queue.length;
      $('done-count').textContent = data.done.length;
      renderPrinters();
      renderPrinterSelect();
      renderQueue();
      renderDone();
    }

    function renderPrinters() {
      var grid = $('printer-grid');
      grid.innerHTML = '';
      $('printer-empty').hidden = state.printers.length > 0;

      state.printers.forEach(function (printer) {
        var jobs = state.queue.filter(function (j) { return j.printerId === printer.id; });

        var slots = [];
        for (var i = 0; i < COLOR_SLOTS; i++) slots.push(colorSlot(printer, i));

        var jobItems = jobs.length
          ? jobs.map(function (job) {
              return el('li', {}, [
                el('span', { className: 'job-text' }, [
                  el('span', { className: 'job-title', text: job.title }),
                  el('span', { className: 'job-time', text: 'นำเข้า ' + job.addedAt })
                ]),
                doneButton(job)
              ]);
            })
          : [el('li', { className: 'none', text: 'ไม่มีงานค้าง' })];

        grid.appendChild(el('div', { className: 'printer-card' }, [
          el('div', { className: 'printer-head' }, [
            el('span', { className: 'printer-name', text: printer.name }),
            el('span', { className: 'printer-count', text: 'ค้างพิมพ์ ' + jobs.length + ' งาน' })
          ]),
          el('div', { className: 'colors' }, slots),
          el('ul', { className: 'printer-jobs' }, jobItems),
          el('div', { className: 'printer-foot' }, [
            el('button', {
              type: 'button',
              className: 'btn-ghost',
              text: 'ลบเครื่อง',
              onclick: function (e) {
                if (!confirm('ลบเครื่องพิมพ์ ' + printer.name + ' ?')) return;
                e.target.disabled = true;
                call('deletePrinter', [printer.id], function (ok) {
                  if (ok) showMessage('ลบเครื่อง ' + printer.name + ' แล้ว', 'success');
                  else e.target.disabled = false;
                });
              }
            })
          ])
        ]));
      });
    }

    function colorSlot(printer, index) {
      var color = printer.colors[index];
      var swatch = el('label', {
        className: 'swatch' + (color ? '' : ' empty'),
        style: color ? 'background:' + color : '',
        title: color ? 'สี ' + (index + 1) + ': ' + color + ' (คลิกเพื่อเปลี่ยน)' : 'สี ' + (index + 1) + ': คลิกเพื่อเลือกสี'
      });
      var input = el('input', { type: 'color' });
      input.value = color || EMPTY_PICKER_VALUE;
      input.addEventListener('change', function () {
        saveColor(printer, index, input.value, swatch);
      });
      swatch.appendChild(input);

      var children = [swatch, el('span', { className: 'color-label', text: color ? color.toUpperCase() : 'ว่าง' })];
      if (color) {
        children.push(el('button', {
          type: 'button',
          className: 'color-clear',
          text: 'ล้าง',
          onclick: function () { saveColor(printer, index, '', swatch); }
        }));
      }
      return el('div', { className: 'color-slot' }, children);
    }

    function saveColor(printer, index, value, swatch) {
      var colors = printer.colors.slice();
      colors[index] = value;
      swatch.classList.add('saving');
      call('updatePrinterColors', [printer.id, colors], function (ok) {
        if (ok) showMessage('บันทึกสีของ ' + printer.name + ' แล้ว', 'success');
        else swatch.classList.remove('saving');
      });
    }

    function doneButton(job) {
      return el('button', {
        type: 'button',
        className: 'btn-done',
        text: '✓ พิมพ์เสร็จ',
        onclick: function (e) {
          e.target.disabled = true;
          call('completeJob', [job.id], function (ok) {
            if (ok) showMessage('ย้าย "' + job.title + '" ไปยังรายการพิมพ์เสร็จแล้ว', 'success');
            else e.target.disabled = false;
          });
        }
      });
    }

    function renderPrinterSelect() {
      var select = $('job-printer');
      var current = select.value;
      select.innerHTML = '';
      select.appendChild(el('option', { value: '', text: state.printers.length ? '-- เลือกเครื่อง --' : '-- ยังไม่มีเครื่องพิมพ์ --' }));
      state.printers.forEach(function (p) {
        select.appendChild(el('option', { value: p.id, text: p.name }));
      });
      if (printerById(current)) select.value = current;
    }

    function renderQueue() {
      var body = $('queue-body');
      body.innerHTML = '';
      $('queue-empty').hidden = state.queue.length > 0;
      state.queue.forEach(function (job, i) {
        body.appendChild(el('tr', {}, [
          el('td', { text: String(i + 1) }),
          el('td', { text: job.title }),
          el('td', {}, [printerChip(job.printerId, job.printerName)]),
          el('td', { className: 'nowrap', text: job.addedAt }),
          el('td', { className: 'actions' }, [
            doneButton(job),
            el('button', {
              type: 'button',
              className: 'btn-ghost',
              text: 'ลบ',
              title: 'ลบงานออกจากคิว (ไม่บันทึกว่าพิมพ์เสร็จ)',
              onclick: function (e) {
                if (!confirm('ลบงาน "' + job.title + '" ออกจากคิว?\n(งานจะไม่ถูกย้ายไปรายการพิมพ์เสร็จ)')) return;
                e.target.disabled = true;
                call('deleteJob', [job.id], function (ok) { if (!ok) e.target.disabled = false; });
              }
            })
          ])
        ]));
      });
    }

    function renderDone() {
      var body = $('done-body');
      body.innerHTML = '';
      $('done-empty').hidden = state.done.length > 0;
      state.done.forEach(function (job) {
        body.appendChild(el('tr', {}, [
          el('td', { text: job.title }),
          el('td', { className: 'nowrap', text: job.printerName }),
          el('td', { className: 'nowrap', text: job.addedAt }),
          el('td', { className: 'nowrap', text: job.doneAt })
        ]));
      });
    }

    // ---- Events ----

    document.querySelectorAll('.tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.tab').forEach(function (t) {
          t.classList.toggle('active', t === tab);
        });
        document.querySelectorAll('.tab-panel').forEach(function (panel) {
          panel.hidden = panel.id !== 'tab-' + tab.dataset.tab;
        });
      });
    });

    $('add-printer-btn').addEventListener('click', function () {
      var btn = this;
      btn.disabled = true;
      call('addPrinter', [], function (ok) {
        btn.disabled = false;
        if (ok) {
          var added = state.printers[state.printers.length - 1];
          showMessage('เพิ่มเครื่อง ' + added.name + ' แล้ว — เลือกสีประจำเครื่องได้เลย', 'success');
        }
      });
    });

    $('job-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var title = $('job-title').value.trim();
      var printerId = $('job-printer').value;
      if (!title || !printerId) return;
      var btn = $('job-submit');
      btn.disabled = true;
      call('addJob', [title, printerId], function (ok) {
        btn.disabled = false;
        if (ok) {
          $('job-title').value = '';
          $('job-title').focus();
          showMessage('เพิ่ม "' + title + '" เข้าคิวแล้ว', 'success');
        }
      });
    });

    // Keep the page in sync when several people use it at the same time.
    setInterval(function () {
      if (busy === 0 && !document.hidden) call('getData');
    }, REFRESH_MS);

    call('getData');
  })();
</script>
